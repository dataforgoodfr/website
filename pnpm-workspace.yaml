packages:
  - backend
  - frontend
  - packages/*

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  msw: true
  sharp: true

# Comportement de pnpm 10 : pnpm 11+ reinstallait tout le workspace avant
# `pnpm build` dans l'image backend (+183 Mio de dependances du frontend).
verifyDepsBeforeRun: false
